{% extends 'base.html' %}
{% block title %}Connexion — WeArt{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>WeArt</h1>
      <p>Bienvenue de retour</p>
    </div>

    <h2 class="auth-title">Connexion</h2>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Nom d'utilisateur ou email</label>
        <input class="form-input" type="text" name="identifier" required
               placeholder="nom_utilisateur ou email@..."
               value="{{ request.form.get('identifier','') }}">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input class="form-input" type="password" name="password" required placeholder="••••••••">
      </div>
      <label class="form-checkbox" style="margin-bottom:18px;">
        <input type="checkbox" name="remember"> Se souvenir de moi
      </label>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">
        Se connecter
      </button>
    </form>

    <div class="auth-footer" style="display:flex;justify-content:space-between;">
      <a href="{{ url_for('forgot_password') }}">Mot de passe oublié ?</a>
      <a href="{{ url_for('register') }}">Créer un compte</a>
    </div>
  </div>
</div>
{% endblock %}
