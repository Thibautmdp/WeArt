{% extends 'base.html' %}
{% block title %}Paramètres — WeArt{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
{% endblock %}

{% block content %}
<div class="page" style="max-width:700px;">
  <h1 class="section-title">⚙️ Paramètres du compte</h1>

  <!-- Profile settings -->
  <div class="card" style="padding:24px;margin-bottom:24px;">
    <h2 style="font-size:1.1rem;margin-bottom:20px;">Informations du profil</h2>
    <form method="POST">
      <input type="hidden" name="action" value="profile">
      <div class="form-group">
        <label class="form-label">Nom affiché</label>
        <input class="form-input" type="text" name="display_name"
               value="{{ current_user.display_name or '' }}" placeholder="Ton nom public">
      </div>
      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea class="form-textarea" name="bio" placeholder="Parle de toi, de ton art…">{{ current_user.bio or '' }}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Ville / Pays</label>
        <input class="form-input" type="text" name="location" value="{{ current_user.location or '' }}" placeholder="Paris, France">
      </div>
      <div class="form-group">
        <label class="form-label">Site web</label>
        <input class="form-input" type="url" name="website" value="{{ current_user.website or '' }}" placeholder="https://ton-site.com">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">Instagram</label>
          <input class="form-input" type="url" name="instagram_url" value="{{ current_user.instagram_url or '' }}" placeholder="https://instagram.com/...">
        </div>
        <div class="form-group">
          <label class="form-label">Twitter / X</label>
          <input class="form-input" type="url" name="twitter_url" value="{{ current_user.twitter_url or '' }}" placeholder="https://twitter.com/...">
        </div>
      </div>
      <button class="btn btn-primary" type="submit">Sauvegarder</button>
    </form>
  </div>

  <!-- Password -->
  <div class="card" style="padding:24px;">
    <h2 style="font-size:1.1rem;margin-bottom:20px;">Changer le mot de passe</h2>
    <form method="POST">
      <input type="hidden" name="action" value="password">
      <div class="form-group">
        <label class="form-label">Mot de passe actuel</label>
        <input class="form-input" type="password" name="old_password" required>
      </div>
      <div class="form-group">
        <label class="form-label">Nouveau mot de passe</label>
        <input class="form-input" type="password" name="new_password" required>
      </div>
      <button class="btn btn-ghost" type="submit">Changer le mot de passe</button>
    </form>
  </div>
</div>
{% endblock %}
