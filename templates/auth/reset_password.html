{% extends 'base.html' %}
{% block title %}Nouveau mot de passe — WeArt{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>WeArt</h1>
      <p>Choisir un nouveau mot de passe</p>
    </div>

    <h2 class="auth-title">Nouveau mot de passe</h2>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Nouveau mot de passe</label>
        <input class="form-input" type="password" name="password" required
               placeholder="Au moins 6 caractères" autofocus>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">
        Enregistrer le mot de passe
      </button>
    </form>

    <div class="auth-footer" style="margin-top:20px;">
      <a href="{{ url_for('login') }}">← Retour à la connexion</a>
    </div>
  </div>
</div>
{% endblock %}
